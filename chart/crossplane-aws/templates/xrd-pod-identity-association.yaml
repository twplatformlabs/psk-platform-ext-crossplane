---
apiVersion: apiextensions.crossplane.io/v2
kind: CompositeResourceDefinition
metadata:
  name: podidentityassociations.platform.psk.io
spec:
  scope: Namespaced
  group: platform.psk.io
  names:
    kind: PodIdentityAssociation
    plural: podidentityassociations
  versions:
    - name: v1alpha1
      served: true
      referenceable: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              required:
                - serviceAccountName
                - serviceAccountNamespace
                - roleName
              properties:
                serviceAccountName:
                  type: string
                  description: Name of the Kubernetes ServiceAccount to associate.
                serviceAccountNamespace:
                  type: string
                  description: Namespace of the Kubernetes ServiceAccount.
                roleName:
                  type: string
                  description: Metadata name of the Crossplane IAM Role managed resource whose ARN will be resolved via roleArnRef.
            status:
              type: object
              properties:
                associationArn:
                  type: string
                associationId:
                  type: string
