{{- range .Values.providers.packages }}
{{- $parts := splitList "/" . }}
{{- $withVersion := printf "%s-%s" (index $parts 1) (index $parts 2) }}
{{- $name := $withVersion | splitList ":" | first }}
---
apiVersion: pkg.crossplane.io/v1
kind: Provider
metadata:
  name: {{ $name }}
spec:
  package: {{ . }}
  packagePullPolicy: Always
  runtimeConfigRef:
    name: management-node-selector

---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: pdb-{{ $name }}
  namespace: {{ $.Values.namespace }}
spec:
  maxUnavailable: 1
  selector:
    matchLabels:
      pkg.crossplane.io/provider: {{ $name }}
{{- end }}
