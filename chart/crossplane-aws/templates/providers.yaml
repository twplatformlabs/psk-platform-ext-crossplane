{{- range .Values.providers.packages }}
{{- $parts := splitList "/" . }}
{{- $withVersion := printf "%s-%s" (index $parts 1) (index $parts 2) }}
{{- $name := $withVersion | splitList ":" | first }}
---
apiVersion: pkg.crossplane.io/v1
kind: Provider
metadata:
  name: {{ $name }}
spec:
  package: {{ . }}
  packagePullPolicy: Always
  runtimeConfigRef:
    target: management-arm-runtime

---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: pdb-{{ $name }}
  namespace: {{ .Values.namespace }}
spec:
  maxUnavailable: 1
  selector:
    matchLabels:
      pkg.crossplane.io/provider: {{ $name }}
{{- end }}

---
apiVersion: pkg.crossplane.io/v1beta1
kind: DeploymentRuntimeConfig
metadata:
  name: management-node-selector
spec:
  deploymentTemplate:
    spec:
      template:
        spec:
          nodeSelector:
            nodegroup: management-arm-rkt-mng
          tolerations:
            - key: dedicated
              operator: Equal
              value: management
              effect: NoSchedule
          securityContext:
            runAsUser: 65532
            runAsGroup: 65532
            runAsNonRoot: true
            fsGroup: 65532
            seccompProfile:
              type: RuntimeDefault
