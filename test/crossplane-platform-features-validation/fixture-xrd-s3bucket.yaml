---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: s3bucket-test
  namespace: default

---
apiVersion: platform.psk.io/v1alpha1
kind: S3Bucket
metadata:
  name: test-bucket
  namespace: default
spec:
  serviceAccountName: s3bucket-test
  access: readwritedelete
  versioning: false
  expireAfterDays: 3